[package]
name = "timesfm3-ui"
version = "0.1.0"
description = "TimesFM 3.0 GUI Forecaster"
authors = ["you"]
license = "Apache-2.0"
repository = ""
edition = "2021"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
csv = "1.3"
chrono = { version = "0.4", features = ["serde"] }
timesfm3 = { path = "../.." }
