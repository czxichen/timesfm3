name: Release TimesFM Desktop Client

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: '发布版本号 Tag (例如: v0.1.0，留空则自动根据 tauri.conf.json 生成)'
        required: false
        default: ''
      is_draft:
        description: '是否保存为草稿 (Draft Release，方便在正式公开发布前先检查)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            name: 'Windows-x64'
            target: 'x86_64-pc-windows-msvc'
          - platform: 'macos-latest'
            name: 'macOS-arm64'
            target: 'aarch64-apple-darwin'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './ui/src-tauri -> ./ui/src-tauri/target'

      - name: Install Frontend Dependencies
        working-directory: ./ui
        run: npm ci

      - name: Build Desktop Application & Create GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: './ui'
          tagName: ${{ github.event.inputs.tag_name || (github.ref_type == 'tag' && github.ref_name) || 'v__VERSION__' }}
          releaseName: 'TimesFM 3.0 v__VERSION__'
          releaseBody: |
            ## TimesFM 3.0 桌面时序预测客户端 🚀

            基于 Google DeepMind TimesFM 3.0 与纯 Rust 高性能自研推理引擎打造的轻量级桌面时序预测平台。

            ### 📦 安装包下载 (Assets)
            * **Windows 用户 (推荐)**：
              * ⬇️ **`timesfm3-ui_*_x64-setup.exe`**：标准图形化安装程序（推荐，直接双击安装，支持创建桌面快捷方式）。
              * ⬇️ **`timesfm3-ui_*_x64_en-US.msi`**：企业/系统级 MSI 安装包。
            * **macOS 用户**：
              * ⬇️ **`timesfm3-ui_*_aarch64.dmg`**：Apple Silicon (M1/M2/M3/M4) 原生应用镜像。

            ### 💡 核心特性
            1. ⚡ **零 Python/PyTorch 依赖**：纯 Rust 编写的高性能推理引擎，AVX2 向量加速，免去复杂的 Python/CUDA 环境配置。
            2. 📊 **全格式时序输入支持**：支持 CSV、Excel (.xlsx, .xls)、TSV、TXT、JSON，以及直接从 Excel/网页剪贴板复制粘贴。
            3. 🎯 **自适应时序预测**：智能识别时间戳与数据采样周期（日/周/时/分），支持任意预测步长与分位数不确定性区间。
            4. 🪶 **超轻量体积（约 20MB）**：客户端与模型权重解耦，界面内置 ModelScope（魔搭）与 HuggingFace 一键下载指引。
          releaseDraft: ${{ github.event.inputs.is_draft || false }}
          prerelease: false

      - name: Upload Build Artifacts to Actions
        uses: actions/upload-artifact@v4
        with:
          name: timesfm3-ui-${{ matrix.name }}
          path: |
            ui/src-tauri/target/release/bundle/nsis/*.exe
            ui/src-tauri/target/release/bundle/msi/*.msi
            ui/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: warn
